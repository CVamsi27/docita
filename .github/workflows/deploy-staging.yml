name: Deploy Staging API

on:
  push:
    branches:
      - staging
    paths:
      - 'apps/api/**'
      - 'packages/types/**'
      - 'packages/utils/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'fly.staging.toml'
      - '.github/workflows/deploy-staging.yml'
  workflow_run:
    workflows:
      - 'Database Migrations Staging'
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect API Deploy Target
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Detect changed deploy targets
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/types/**'
              - 'packages/utils/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'fly.staging.toml'
            db:
              - 'packages/db/**'

  deploy-api:
    name: Deploy API (Fly.io Staging)
    needs: changes
    if: |
      needs.changes.outputs.api == 'true' &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'staging'
        ) ||
        needs.changes.outputs.db == 'false'
      )
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Read Fly app from fly.staging.toml
        id: fly-config
        run: |
          app_name="$(ruby -e 'puts File.read("fly.staging.toml")[/^\s*app\s*=\s*["'\'']([^"'\'']+)["'\'']\s*$/, 1]')"
          if [ -z "$app_name" ]; then
            echo "Unable to read Fly app name from fly.staging.toml"
            exit 1
          fi
          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Sync staging database secret
        run: |
          if [ -z "${{ secrets.STAGING_DATABASE_URL }}" ]; then
            echo "STAGING_DATABASE_URL secret is required."
            exit 1
          fi

          flyctl secrets set \
            STAGING_DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
            --app "${{ steps.fly-config.outputs.app_name }}"

      - name: Deploy API to Fly.io
        run: flyctl deploy --config fly.staging.toml --app "${{ steps.fly-config.outputs.app_name }}" --remote-only
