name: End-to-End Tests - Critical Flows

on:
  push:
    branches: [main]
    paths:
      - "apps/app/**"
      - "apps/api/**"
      - "packages/data-access/**"
      - "packages/db/**"
      - "packages/hooks/**"
      - "packages/types/**"
      - "packages/ui/**"
      - "packages/utils/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  critical-flows-e2e:
    name: Critical frontend E2E (onboarding, verify, auth, tenant)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://docita:password@localhost:5434/docita_test
      JWT_SECRET: super-secret-jwt-key-for-testing-purposes-only
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NODE_ENV: test
      APP_URL: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:3001/api/v1
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001/api/v1
      API_PROXY_TARGET: http://127.0.0.1:3001
      CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      WHATSAPP_PRODUCTION_MODE: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docita
          POSTGRES_PASSWORD: password
          POSTGRES_DB: docita_test
          POSTGRES_INITDB_ARGS: >-
            --set=shared_preload_libraries=pg_stat_statements
            --set=pg_stat_statements.track=all
            --set=pg_stat_statements.max=10000
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U docita -d docita_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run Database Migrations
        run: pnpm db:deploy

      - name: Install Playwright browsers
        run: pnpm --filter @docita/app exec playwright install --with-deps

      - name: Prepare API workspace packages
        run: pnpm --filter @docita/api run predev

      - name: Prepare App workspace packages
        run: pnpm --filter @docita/app run prestart

      - name: Start API server
        run: |
          pnpm --filter @docita/api run dev > /tmp/docita-api.log 2>&1 &
          echo $! > /tmp/docita-api.pid

      - name: Start App server
        run: |
          pnpm --filter @docita/app run dev > /tmp/docita-app.log 2>&1 &
          echo $! > /tmp/docita-app.pid

      - name: Wait for API and App
        run: |
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:3001/api/v1/health >/dev/null 2>&1 || curl -fsS http://127.0.0.1:3001/health >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 120 ]; then
              echo "API server failed to start"
              tail -n 200 /tmp/docita-api.log || true
              exit 1
            fi
            sleep 2
          done

          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 120 ]; then
              echo "App server failed to start"
              tail -n 200 /tmp/docita-app.log || true
              exit 1
            fi
            sleep 2
          done

      - name: Run critical E2E suites
        run: |
          unset NO_COLOR
          pnpm --filter @docita/app exec playwright test \
            e2e/clinic-registration.spec.ts \
            e2e/verify-doctor.spec.ts \
            e2e/auth.spec.ts \
            e2e/critical-flows.spec.ts \
            e2e/front-desk-sidebar.spec.ts

      - name: Run mobile E2E suites
        run: |
          unset NO_COLOR
          pnpm --filter @docita/app exec playwright test \
            e2e/mobile-forms.spec.ts \
            e2e/mobile-protected-routes.spec.ts \
            e2e/mobile-portal-routes.spec.ts \
            e2e/mobile-auth-setup.spec.ts \
            --project=mobile-chrome

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "==== API LOGS ===="
          tail -n 300 /tmp/docita-api.log || true
          echo "==== APP LOGS ===="
          tail -n 300 /tmp/docita-app.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-critical-flows
          path: apps/app/playwright-report/
          if-no-files-found: ignore
          retention-days: 30
