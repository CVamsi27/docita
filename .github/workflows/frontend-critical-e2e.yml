name: End-to-End Tests - Critical Flows (Vite)

on:
  schedule:
    # Weekly: Monday 2 AM UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  critical-flows-e2e:
    name: Critical frontend E2E (onboarding, verify, auth, tenant)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://docita:password@localhost:5434/docita_test
      JWT_SECRET: super-secret-jwt-key-for-testing-purposes-only
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NODE_ENV: test
      APP_URL: http://127.0.0.1:5173
      API_URL: http://127.0.0.1:3001/api/v1
      API_PROXY_TARGET: http://127.0.0.1:3001
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      WHATSAPP_PRODUCTION_MODE: "false"
      # Razorpay TEST credentials (rzp_test_…) so onboarding payment
      # verification runs against the sandbox. The API verifies the HMAC
      # signature and the order amount; the test-key path skips the live
      # payment fetch (see razorpay-order.adapter.ts).
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docita
          POSTGRES_PASSWORD: password
          POSTGRES_DB: docita_test
          POSTGRES_INITDB_ARGS: >-
            --set=shared_preload_libraries=pg_stat_statements
            --set=pg_stat_statements.track=all
            --set=pg_stat_statements.max=10000
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U docita -d docita_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run Database Migrations
        run: pnpm db:deploy

      - name: Install Playwright browsers
        run: pnpm --filter @docita/app exec playwright install --with-deps

      - name: Prepare API workspace packages
        run: pnpm --filter @docita/api run predev

      - name: Build app workspace deps
        run: pnpm run build:web-workspace-deps

      - name: Build app
        run: pnpm --filter @docita/app run build

      - name: Start API server
        run: |
          pnpm --filter @docita/api run dev > /tmp/docita-api.log 2>&1 &
          echo $! > /tmp/docita-api.pid

      - name: Start app server (preview)
        run: |
          pnpm --filter @docita/app exec vite preview --port 5173 > /tmp/docita-app.log 2>&1 &
          echo $! > /tmp/docita-app.pid

      - name: Wait for API and App
        run: |
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:3001/api/v1/health >/dev/null 2>&1 || curl -fsS http://127.0.0.1:3001/health >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 120 ]; then
              echo "API server failed to start"
              tail -n 200 /tmp/docita-api.log || true
              exit 1
            fi
            sleep 2
          done

          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:5173/login >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 120 ]; then
              echo "App server failed to start"
              tail -n 200 /tmp/docita-app.log || true
              exit 1
            fi
            sleep 2
          done

      - name: Run critical E2E suites
        run: |
          unset NO_COLOR
          pnpm --filter @docita/app exec playwright test --config=playwright.config.ts

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "==== API LOGS ===="
          tail -n 300 /tmp/docita-api.log || true
          echo "==== APP LOGS ===="
          tail -n 300 /tmp/docita-app.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-critical-flows
          path: apps/app/playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright test-results (traces, snapshots)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-critical-flows
          path: apps/app/test-results/
          if-no-files-found: ignore
          retention-days: 30
