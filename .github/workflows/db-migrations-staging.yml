name: Database Migrations Staging

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches:
      - staging
    paths:
      - packages/db/prisma/**
      - packages/db/scripts/**
      - packages/db/package.json
      - .github/workflows/db-migrations-staging.yml

jobs:
  migrate-db:
    name: Apply Prisma Migrations
    runs-on: ubuntu-latest
    env:
      NODE_ENV: staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "STAGING_DATABASE_URL secret is required."
            exit 1
          fi
          pnpm --filter @workspace/db run db:generate

      - name: Run Prisma Migrations
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "STAGING_DATABASE_URL secret is required."
            exit 1
          fi
          pnpm --filter @workspace/db run db:migrate:safe
