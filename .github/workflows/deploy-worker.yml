name: Deploy Production Worker

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "packages/db/**"
      - "packages/types/**"
      - "packages/utils/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "apps/worker/fly.toml"
      - ".github/workflows/deploy-worker.yml"

concurrency:
  group: deploy-production-worker-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect Worker Deploy Target
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detect.outputs.api }}
      worker: ${{ steps.detect.outputs.worker }}
      db: ${{ steps.detect.outputs.db }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Detect changed deploy targets
        id: detect
        run: node scripts/detect-workflow-scope.mjs deploy

  deploy-worker:
    name: Deploy Worker (Fly.io)
    needs: changes
    if: "!failure() && needs.changes.outputs.worker == 'true'"
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WORKER }}
    steps:
      - uses: actions/checkout@v5
      - name: Read Fly app from apps/worker/fly.toml
        id: fly-config
        run: |
          app_name="$(ruby -e 'puts File.read("apps/worker/fly.toml")[/^\s*app\s*=\s*["'\'']([^"'\'']+)["'\'']\s*$/, 1]')"
          if [ -z "$app_name" ]; then
            echo "Unable to read Fly app name from apps/worker/fly.toml"
            exit 1
          fi
          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy Worker to Fly.io
        run: flyctl deploy --config apps/worker/fly.toml --app "${{ steps.fly-config.outputs.app_name }}" --remote-only --ha=false
