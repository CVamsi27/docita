name: Deploy Cloudflare frontends

on:
  push:
    branches:
      - main
    paths:
      - "apps/app/**"
      - "apps/internal/**"
      - "apps/landing/**"
      - "packages/data-access/**"
      - "packages/hooks/**"
      - "packages/types/**"
      - "packages/ui/**"
      - "packages/utils/**"
      - "scripts/deploy/**"
      - "scripts/checks/check-worker-size.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect frontend deploy targets
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.detect.outputs.app }}
      internal: ${{ steps.detect.outputs.internal }}
      landing: ${{ steps.detect.outputs.landing }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Detect changed frontend apps
        id: detect
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_OUTPUT: ${{ github.output }}
        run: node scripts/workflow/detect-workflow-scope.mjs ci

  gate:
    name: Check Cloudflare deploy credentials
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - uses: actions/checkout@v5

      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing-secrets" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if node scripts/deploy/verify-cloudflare-deploy-credentials.mjs; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "reason=ready" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=invalid-credentials" >> "$GITHUB_OUTPUT"
          fi

  deploy-app:
    name: Deploy app (Cloudflare)
    needs: [changes, gate]
    if: needs.gate.outputs.enabled == 'true' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          package-manager-cache: false
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clear wrangler deploy cache
        run: rm -rf node_modules/.cache/wrangler apps/app/.wrangler

      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @docita/app run deploy:cloudflare:production

  deploy-internal:
    name: Deploy internal (Cloudflare)
    needs: [changes, gate]
    if: needs.gate.outputs.enabled == 'true' && needs.changes.outputs.internal == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          package-manager-cache: false
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clear wrangler deploy cache
        run: rm -rf node_modules/.cache/wrangler apps/internal/.wrangler

      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @docita/internal run deploy:cloudflare:production

  deploy-landing:
    name: Deploy landing (Cloudflare)
    needs: [changes, gate]
    if: needs.gate.outputs.enabled == 'true' && needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          package-manager-cache: false
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clear wrangler deploy cache
        run: rm -rf node_modules/.cache/wrangler apps/landing/.wrangler

      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @docita/landing run deploy:cloudflare

  skip-notice:
    name: Cloudflare deploy skipped (missing creds)
    needs: [changes, gate]
    if: >-
      needs.gate.outputs.enabled != 'true' &&
      (
        needs.changes.outputs.app == 'true' ||
        needs.changes.outputs.internal == 'true' ||
        needs.changes.outputs.landing == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log skip reason
        env:
          SKIP_REASON: ${{ needs.gate.outputs.reason }}
        run: |
          if [ "${SKIP_REASON}" = "invalid-credentials" ]; then
            echo "::warning::Cloudflare deploy skipped: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID failed verification (authentication error 10000 / missing Workers Routes permission). Rotate the token using the Edit Cloudflare Workers template with Zone Workers Routes access for docita.work, then re-run this workflow."
          else
            echo "Cloudflare deploy skipped: set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable CI-gated frontend deploys."
          fi
