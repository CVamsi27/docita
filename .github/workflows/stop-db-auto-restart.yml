name: Stop DB - Auto-Restart Guard

# Explicit minimum permissions: the workflow only reads AWS credentials
# and calls describe-db-instances / stop-db-instance. It does not write
# to the repository, comment on issues, or push to packages — so the
# default `read-all` is too broad. This is the documented GitHub Actions
# posture: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
permissions:
  contents: read

on:
  schedule:
    # RDS auto-restarts exactly 7 days after every stop, so the restart
    # day/time drifts each cycle. A 6-hourly check catches it within
    # ~6 hours regardless of when it comes up.
    - cron: "10 */6 * * *"
  workflow_dispatch:

concurrency:
  group: stop-db-guard
  cancel-in-progress: false

jobs:
  check-and-stop:
    name: Stop RDS if running
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Poll and stop RDS instance
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          INSTANCE="${{ secrets.RDS_INSTANCE_ID }}"
          # RDS auto-restarts 7 days after a stop. On restart it transitions
          # starting -> backing-up -> available, so poll until it settles in
          # a terminal state instead of guessing from a single snapshot.
          for i in $(seq 1 28); do
            STATUS=$(aws rds describe-db-instances \
              --db-instance-identifier "$INSTANCE" \
              --query 'DBInstances[0].DBInstanceStatus' \
              --output text)
            echo "Poll $i: $INSTANCE status = $STATUS"
            case "$STATUS" in
              stopped)
                echo "Already stopped - nothing to do"
                exit 0
                ;;
              available)
                echo "Instance is running - stopping it now"
                aws rds stop-db-instance --db-instance-identifier "$INSTANCE"
                echo "Stop command issued"
                exit 0
                ;;
              *)
                # starting / backing-up / rebooting / storage-optimization:
                # not yet in a stoppable state, wait and re-check
                sleep 30
                ;;
            esac
          done
          echo "Instance never reached a terminal state within 14 minutes"
          exit 1
