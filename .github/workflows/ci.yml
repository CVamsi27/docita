name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "fly.toml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "fly.toml"
      - ".github/workflows/**"

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect CI Scope
    runs-on: ubuntu-latest
    outputs:
      dependencies: ${{ steps.filter.outputs.dependencies }}
      api: ${{ steps.filter.outputs.api }}
      app: ${{ steps.filter.outputs.app }}
      internal: ${{ steps.filter.outputs.internal }}
      landing: ${{ steps.filter.outputs.landing }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            dependencies:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'apps/**/package.json'
              - 'packages/**/package.json'
            api:
              - 'apps/api/**'
              - 'packages/db/**'
              - 'packages/types/**'
              - 'packages/utils/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'fly.toml'
            app:
              - 'apps/app/**'
              - 'packages/auth/**'
              - 'packages/data-access/**'
              - 'packages/hooks/**'
              - 'packages/types/**'
              - 'packages/ui/**'
              - 'packages/utils/**'
              - 'scripts/ensure-opennext-prefetch-manifest-patch.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            internal:
              - 'apps/internal/**'
              - 'packages/data-access/**'
              - 'packages/types/**'
              - 'packages/ui/**'
              - 'packages/utils/**'
              - 'scripts/ensure-opennext-prefetch-manifest-patch.mjs'
              - 'scripts/check-worker-size.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            landing:
              - 'apps/landing/**'
              - 'packages/ui/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            db:
              - 'apps/api/**'
              - 'packages/db/**'
              - 'packages/types/**'
              - 'packages/utils/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'

  repo-standards:
    name: Repository Standards
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].sort.each { |path| YAML.load_file(path) }'

      - name: Verify Repository Standards
        run: pnpm verify:standard

  api-quality:
    name: API Unit Checks
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Lint API
        run: pnpm --filter @docita/api run lint

      - name: Typecheck API
        run: pnpm --filter @docita/api run check-types

      - name: Test API
        run: pnpm --filter @docita/api run test

      - name: Build API on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm --filter @docita/api run build

  app-quality:
    name: App Unit Checks
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint app
        run: pnpm --filter @docita/app run lint

      - name: Typecheck app
        run: pnpm --filter @docita/app run check-types

      - name: Test app
        run: pnpm --filter @docita/app run test

  internal-quality:
    name: Internal Unit Checks
    needs: changes
    if: needs.changes.outputs.internal == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint internal
        run: pnpm --filter @docita/internal run lint

      - name: Typecheck internal
        run: pnpm --filter @docita/internal run check-types

      - name: Test internal
        run: pnpm --filter @docita/internal run test

      - name: Build internal on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm --filter @docita/internal run build

  landing-quality:
    name: Landing Checks
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint landing
        run: pnpm --filter @docita/landing run lint

      - name: Typecheck landing
        run: pnpm --filter @docita/landing run check-types

      - name: Build landing on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm --filter @docita/landing run build

  security-audit:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  validate-migrations:
    name: Validate Migrations
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGPORT: "5434"
      PGUSER: docita
      PGPASSWORD: password
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docita
          POSTGRES_PASSWORD: password
          POSTGRES_DB: docita
          POSTGRES_INITDB_ARGS: >-
            --set=shared_preload_libraries=pg_stat_statements
            --set=pg_stat_statements.track=all
            --set=pg_stat_statements.max=10000
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate migrations
        env:
          DATABASE_URL: postgresql://docita:password@localhost:5434/docita
        run: pnpm db:deploy

      - name: Check for migration drift
        env:
          DATABASE_URL: postgresql://docita:password@localhost:5434/docita
        working-directory: packages/db
        run: |
          pnpm exec prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code

      - name: DB guardrails
        env:
          DATABASE_URL: postgresql://docita:password@localhost:5434/docita
        run: |
          pnpm --filter @workspace/db run db:check-integrity
          pnpm --filter @workspace/db run db:analyze-indexes
          pnpm --filter @workspace/db run db:profile-queries
          pnpm --filter @workspace/db run db:check-query-plans

  app-bundle-analysis:
    name: App Bundle Analysis
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Analyze app bundle
        env:
          ANALYZE: "true"
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm --filter @docita/app run build:analyze

      - name: Capture perf baseline
        run: pnpm perf:baseline

      - name: Enforce perf budget
        run: pnpm perf:budget:enforce
