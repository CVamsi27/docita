name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect CI Scope
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.filter.outputs.repo }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      db: ${{ steps.filter.outputs.db }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            repo:
              - 'apps/**'
              - 'packages/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/**'
            dependencies:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'apps/**/package.json'
              - 'packages/**/package.json'
            db:
              - 'apps/api/**'
              - 'packages/db/**'
              - 'packages/types/**'
              - 'packages/utils/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            frontend:
              - 'apps/app/**'
              - 'apps/internal/**'
              - 'apps/landing/**'
              - 'packages/auth/**'
              - 'packages/data-access/**'
              - 'packages/hooks/**'
              - 'packages/types/**'
              - 'packages/ui/**'
              - 'packages/utils/**'
              - 'scripts/check-worker-size.mjs'
              - 'scripts/ensure-opennext-prefetch-manifest-patch.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'

  pr-baseline:
    name: PR Baseline Checks
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.repo == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22.12.0"]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Repository Standards
        run: pnpm verify:standard

      - name: Generate Prisma Client
        run: pnpm db:generate

  main-build-and-test:
    name: Main Build, Lint, and Test
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.repo == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22.12.0"]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Repository Standards
        run: pnpm verify:standard

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test (Unit)
        run: pnpm test -- --coverage

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            **/coverage/
            !**/node_modules/**
          retention-days: 14

  security-audit:
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit Dependencies
        run: pnpm audit --audit-level=high

  validate-migrations:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    name: Validate Migrations
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGPORT: "5434"
      PGUSER: docita
      PGPASSWORD: password
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docita
          POSTGRES_PASSWORD: password
          POSTGRES_DB: docita
          POSTGRES_INITDB_ARGS: >-
            --set=shared_preload_libraries=pg_stat_statements
            --set=pg_stat_statements.track=all
            --set=pg_stat_statements.max=10000
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Migrations
        env:
          DATABASE_URL: postgresql://docita:password@localhost:5434/docita
        run: pnpm db:deploy

      - name: Check for migration drift
        env:
          DATABASE_URL: postgresql://docita:password@localhost:5434/docita
        working-directory: packages/db
        run: |
          echo "Checking that schema.prisma has no changes missing a migration..."
          pnpm exec prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code
          echo "No drift detected."

      - name: DB integrity and performance guardrails
        env:
          DATABASE_URL: postgresql://docita:password@localhost:5434/docita
        run: |
          pnpm --filter @workspace/db run db:check-integrity
          pnpm --filter @workspace/db run db:analyze-indexes
          pnpm --filter @workspace/db run db:profile-queries
          pnpm --filter @workspace/db run db:check-query-plans

  frontend-bundle-analysis:
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.frontend == 'true'
    name: Frontend Bundle Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Analyze Bundle
        env:
          ANALYZE: "true"
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm --filter @docita/app run build:analyze

      - name: Capture Perf Baseline Snapshot
        run: pnpm perf:baseline

      - name: Perf Budget Check (Warn Mode)
        run: pnpm perf:budget:warn

      - name: Perf Budget Check (Enforced on main)
        run: pnpm perf:budget:enforce
