name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "knip.json"
      - ".github/workflows/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect CI Scope
    runs-on: ubuntu-latest
    outputs:
      dependencies: ${{ steps.detect.outputs.dependencies }}
      api: ${{ steps.detect.outputs.api }}
      app: ${{ steps.detect.outputs.app }}
      internal: ${{ steps.detect.outputs.internal }}
      landing: ${{ steps.detect.outputs.landing }}
      worker: ${{ steps.detect.outputs.worker }}
      db: ${{ steps.detect.outputs.db }}
      knip: ${{ steps.detect.outputs.knip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          package-manager-cache: false

      - name: Detect changed areas
        id: detect
        run: node scripts/workflow/detect-workflow-scope.mjs ci

  repo-standards:
    name: Repository Standards
    needs: changes
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Use Node.js 22.22.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].sort.each { |path| YAML.load_file(path) }'

      - name: Verify Repository Standards
        run: pnpm verify:standard

      - name: Knip unused dependencies and exports
        if: needs.changes.outputs.knip == 'true'
        run: pnpm knip

  api-quality:
    name: API Unit Checks
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Use Node.js 22.22.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build API workspace dependencies
        run: |
          pnpm --filter @workspace/types run build
          pnpm --filter @workspace/authorization run build
          pnpm --filter @workspace/utils run build
          pnpm --filter @workspace/auth run build
          pnpm --filter @workspace/db run build

      - name: Lint API
        run: pnpm --filter @docita/api run lint

      - name: Typecheck API
        run: pnpm --filter @docita/api run check-types

      - name: Fetch main branch for change detection
        run: git fetch origin main --depth=1
      - name: Test API (changed only)
        run: pnpm --filter @docita/api run test:ci --changedSince=origin/main
  api-e2e:
    name: API E2E Tests (${{ matrix.shard }}/${{ matrix.total }})
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            total: 2
          - shard: 2
            total: 2
    env:
      PGHOST: localhost
      PGPORT: "5434"
      PGUSER: docita
      PGPASSWORD: password
      # The suite runs single-process (jest --runInBand) and OOM'd at the
      # default 2GB Node heap (`FATAL ERROR: Ineffective mark-compacts near
      # heap limit`, exit 134). Give each shard a 4GB heap.
      NODE_OPTIONS: --max-old-space-size=4096
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docita
          POSTGRES_PASSWORD: password
          POSTGRES_DB: docita_test
          POSTGRES_INITDB_ARGS: >-
            --set=shared_preload_libraries=pg_stat_statements
            --set=pg_stat_statements.track=all
            --set=pg_stat_statements.max=10000
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U docita -d docita_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
      - name: Use Node.js 22.22.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://docita:password@localhost:5434/docita_test
        run: pnpm db:deploy
      - name: Run API E2E Tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        env:
          DATABASE_URL: postgresql://docita:password@localhost:5434/docita_test
          JWT_SECRET: super-secret-jwt-key-for-testing-purposes-only
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          NODE_ENV: test
          APP_URL: http://localhost:3001
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
          CORS_ORIGINS: http://localhost:3000
          WHATSAPP_PRODUCTION_MODE: "false"
        run: pnpm --filter @docita/api run test:e2e:shard ${{ matrix.shard }}/${{ matrix.total }}

  app-quality:
    name: App Unit Checks
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Use Node.js 22.22.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app workspace dependencies
        run: pnpm run build:web-workspace-deps

      - name: Lint app
        run: pnpm --filter @docita/app run lint

      - name: Typecheck app
        run: pnpm --filter @docita/app run check-types

      - name: Fetch main branch for change detection
        run: git fetch origin main --depth=1
      - name: Test app (changed only)
        run: pnpm --filter @docita/app run test -- --changed=origin/main

      - name: Build app for Cloudflare
        if: github.event_name == 'workflow_dispatch'
        run: pnpm --filter @docita/app run build:cloudflare

      - name: Enforce apps/app worker bundle cap
        if: github.event_name == 'workflow_dispatch'
        # The build:cloudflare:base script already runs the check
        # internally and fails the build on overage. This step is
        # an explicit re-run so the gate is visible in the CI
        # workflow summary.
        run: pnpm check:worker-size:app

  internal-quality:
    name: Internal Unit Checks
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.internal == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Use Node.js 22.22.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build internal workspace dependencies
        run: |
          pnpm --filter @workspace/types run build
          pnpm --filter @workspace/utils run build
          pnpm --filter @workspace/hooks run build
          pnpm --filter @workspace/ui run build
          pnpm --filter @workspace/data-access run build

      - name: Lint internal
        run: pnpm --filter @docita/internal run lint

      - name: Typecheck internal
        run: pnpm --filter @docita/internal run check-types

      - name: Fetch main branch for change detection
        run: git fetch origin main --depth=1
      - name: Test internal (changed only)
        run: pnpm --filter @docita/internal run test -- --changed=origin/main

      - name: Build internal for Cloudflare
        if: github.event_name == 'workflow_dispatch'
        run: pnpm --filter @docita/internal run build:cloudflare

      - name: Enforce apps/internal worker bundle cap
        if: github.event_name == 'workflow_dispatch'
        # Mirrors the apps/app gate above.
        run: pnpm check:worker-size:internal

  landing-quality:
    name: Landing Checks
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Use Node.js 22.22.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build landing workspace dependencies
        run: |
          pnpm --filter @workspace/types run build
          pnpm --filter @workspace/utils run build
          pnpm --filter @workspace/hooks run build
          pnpm --filter @workspace/ui run build

      - name: Lint landing
        run: pnpm --filter @docita/landing run lint

      - name: Typecheck landing
        run: pnpm --filter @docita/landing run check-types

  worker-quality:
    name: Worker Unit Checks
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Use Node.js 22.22.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is required."
            exit 1
          fi
          pnpm --filter @workspace/db run db:generate

      - name: Lint worker package
        run: pnpm --filter @docita/worker run lint

      - name: Typecheck worker package
        run: pnpm --filter @docita/worker run check-types

      - name: Fetch main branch for change detection
        run: git fetch origin main --depth=1
      - name: Test worker (changed only)
        run: pnpm --filter @docita/worker run test:ci --changedSince=origin/main

  security-audit:
    name: Security Audit
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.dependencies == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    # The previous `pnpm audit --audit-level=high` step relied on the
    # registry.npmjs.org audit endpoint, which npm retired in 2025 — that
    # endpoint now returns 410. Switched to OSV-Scanner via the
    # google/osv-scanner-action reusable workflow (the non-PR variant), which
    # queries OSV.dev directly. Covers both PRs and pushes; PRs additionally
    # get the diff-aware `osv-scan` job below. No `runs-on:` — the reusable
    # workflow supplies its own runner.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0

  osv-scan:
    name: OSV Vulnerability Scan
    needs: changes
    # PR-only: flags new vulnerabilities introduced by the PR against base.
    # Pushes to main are covered by the `Security Audit` job above (OSV) plus
    # OSV upstream advisories surfacing in dependabot. Keeping this PR-gated
    # avoids failing main on transient upstream advisories.
    if: github.event_name == 'pull_request' && needs.changes.outputs.dependencies == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.0

  validate-migrations:
    name: Validate Migrations
    needs: changes
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGPORT: "5434"
      PGUSER: docita
      PGPASSWORD: password
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docita
          POSTGRES_PASSWORD: password
          POSTGRES_DB: docita
          POSTGRES_INITDB_ARGS: >-
            --set=shared_preload_libraries=pg_stat_statements
            --set=pg_stat_statements.track=all
            --set=pg_stat_statements.max=10000
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U docita -d docita"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Use Node.js 22.22.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate migrations
        env:
          DATABASE_URL: postgresql://docita:password@localhost:5434/docita
        run: pnpm db:deploy

      - name: Check for migration drift
        env:
          DATABASE_URL: postgresql://docita:password@localhost:5434/docita
        working-directory: packages/db
        run: |
          pnpm exec prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code

      - name: DB guardrails
        env:
          DATABASE_URL: postgresql://docita:password@localhost:5434/docita
        run: |
          pnpm --filter @workspace/db run db:check-integrity
          pnpm --filter @workspace/db run db:analyze-indexes
          pnpm --filter @workspace/db run db:profile-queries
          pnpm --filter @workspace/db run db:check-query-plans

  app-bundle-analysis:
    name: App Bundle Analysis
    needs: changes
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Use Node.js 22.22.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore perf baseline from prior main runs
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: logs/performance/baseline.json
          key: perf-baseline-${{ github.sha }}
          restore-keys: |
            perf-baseline-

      - name: Build app
        run: pnpm --filter @docita/app run build

      - name: Enforce perf budget against prior baseline
        if: github.event_name == 'pull_request'
        run: pnpm perf:budget:enforce

      - name: Enforce per-route bundle budgets
        if: github.event_name == 'pull_request'
        env:
          PERF_ROUTE_BUDGET_MODE: fail
        run: pnpm perf:route-budgets
