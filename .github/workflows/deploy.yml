name: Deploy Production

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "apps/app/**"
      - "apps/internal/**"
      - "apps/landing/**"
      - "packages/auth/**"
      - "packages/data-access/**"
      - "packages/db/**"
      - "packages/hooks/**"
      - "packages/types/**"
      - "packages/ui/**"
      - "packages/utils/**"
      - "scripts/deploy/**"
      - "scripts/checks/check-worker-size.mjs"
      - "scripts/workflow/detect-workflow-scope.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "fly.toml"
      - "apps/worker/fly.toml"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect deploy targets
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detect.outputs.api }}
      worker: ${{ steps.detect.outputs.worker }}
      db: ${{ steps.detect.outputs.db }}
      app: ${{ steps.detect.outputs.app }}
      internal: ${{ steps.detect.outputs.internal }}
      landing: ${{ steps.detect.outputs.landing }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Detect changed deploy targets
        id: detect
        run: node scripts/workflow/detect-workflow-scope.mjs deploy

  migrate-db:
    name: Apply Prisma Migrations
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v7
      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Mask database URL in logs
        run: echo "::add-mask::${{ secrets.DATABASE_URL }}"
      - name: Pre-migration RDS snapshot
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          RDS_INSTANCE_ID: ${{ secrets.RDS_INSTANCE_ID }}
          SKIP_RDS_SNAPSHOT: ${{ vars.SKIP_RDS_SNAPSHOT }}
        run: |
          set -euo pipefail
          if [ "${SKIP_RDS_SNAPSHOT:-}" = "true" ]; then
            echo "::warning title=RDS snapshot skipped::SKIP_RDS_SNAPSHOT=true; proceeding without a labeled pre-deploy snapshot"
            exit 0
          fi
          if [ -z "${RDS_INSTANCE_ID:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "::warning title=RDS snapshot skipped::RDS_INSTANCE_ID or AWS credentials not configured; relying on automated RDS backups"
            exit 0
          fi
          SNAPSHOT_ID="pre-deploy-${GITHUB_SHA::8}-$(date +%s)"
          echo "Creating RDS snapshot $SNAPSHOT_ID for $RDS_INSTANCE_ID"
          aws rds create-db-snapshot --db-instance-identifier "$RDS_INSTANCE_ID" --db-snapshot-identifier "$SNAPSHOT_ID" >/dev/null
          aws rds wait db-snapshot-completed --db-snapshot-identifier "$SNAPSHOT_ID"
          echo "SNAPSHOT_ID=$SNAPSHOT_ID" >> "$GITHUB_ENV"
          echo "::notice title=RDS snapshot::Created $SNAPSHOT_ID (use this as the restore target if rollback is needed)"
      - name: Generate Prisma client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL secret is required."; exit 1; fi
          pnpm --filter @workspace/db run db:generate
      - name: Resolve failed migrations (if any)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL secret is required."; exit 1; fi
          pnpm --filter @workspace/db exec prisma migrate resolve --rolled-back 20260618120000_migrate_free_clinics_to_starter 2>/dev/null || true
          pnpm --filter @workspace/db exec prisma migrate resolve --rolled-back 20260618130000_migrate_front_desk_tiers_to_canonical 2>/dev/null || true
      - name: Run Prisma Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL secret is required."; exit 1; fi
          pnpm --filter @workspace/db run db:migrate:safe
      - name: Verify database schema is in sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/deploy/verify-db-schema-sync.sh

  api-startup-smoke:
    name: API startup smoke test
    needs: [changes, migrate-db]
    if: always() && needs.changes.outputs.api == 'true' && needs.migrate-db.result == 'success'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      APP_URL: https://app.docita.work
      NEXT_PUBLIC_APP_URL: https://app.docita.work
      NEXT_PUBLIC_API_URL: https://api.docita.work/api/v1
      CORS_ORIGINS: https://app.docita.work,https://internal.docita.work
      RLS_ENABLED: "true"
      STORAGE_PROVIDER: r2
      QUEUE_BACKEND: postgres
      ENABLE_SCHEDULERS: false
      NODE_ENV: production
      STARTUP_TIMEOUT_SECONDS: 120
    steps:
      - uses: actions/checkout@v7
      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run API startup smoke test
        run: scripts/deploy/test-api-startup.sh

  deploy-api:
    name: Deploy API (Fly.io)
    needs: [changes, migrate-db, api-startup-smoke]
    if: always() && needs.changes.outputs.api == 'true' && needs.migrate-db.result == 'success' && needs.api-startup-smoke.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Read Fly app from fly.toml
        id: fly-config
        run: |
          app_name="$(ruby -e 'puts File.read("fly.toml")[/^\s*app\s*=\s*["'"'"']([^"'"'"']+)["'"'"']\s*$/, 1]')"
          if [ -z "$app_name" ]; then echo "Unable to read Fly app name from fly.toml"; exit 1; fi
          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy API to Fly.io
        # API keeps blue-green for zero-downtime traffic cutover (the worker
        # opts into rolling). Passed explicitly so the deployment contract is
        # visible at the call site, not just the script default.
        run: bash scripts/deploy/fly-deploy-in-primary-region.sh fly.toml "${{ steps.fly-config.outputs.app_name }}" --strategy bluegreen
      - name: Post-deploy synthetic probes
        env:
          SYNTHETIC_POST_DEPLOY: "1"
          SYNTHETIC_FLY_API_ORIGIN: https://${{ steps.fly-config.outputs.app_name }}.fly.dev/api
          SYNTHETIC_API_ORIGIN: https://api.docita.work/api
          SYNTHETIC_API_BASE_URL: https://api.docita.work/api/v1
          SYNTHETIC_APP_BASE_URL: https://app.docita.work
          SYNTHETIC_MONITOR_EMAIL: ${{ secrets.SYNTHETIC_MONITOR_EMAIL }}
          SYNTHETIC_MONITOR_PASSWORD: ${{ secrets.SYNTHETIC_MONITOR_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: node scripts/monitoring/synthetic/run-probes.mjs

  deploy-worker:
    name: Deploy Worker (Fly.io)
    needs: [changes, migrate-db]
    if: always() && needs.changes.outputs.worker == 'true' && needs.migrate-db.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WORKER }}
    steps:
      - uses: actions/checkout@v7
      - name: Read Fly app from apps/worker/fly.toml
        id: fly-config
        run: |
          app_name="$(ruby -e 'puts File.read("apps/worker/fly.toml")[/^\s*app\s*=\s*["'"'"']([^"'"'"']+)["'"'"']\s*$/, 1]')"
          if [ -z "$app_name" ]; then echo "Unable to read Fly app name from apps/worker/fly.toml"; exit 1; fi
          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy Worker to Fly.io
        run: bash scripts/deploy/fly-deploy-in-primary-region.sh apps/worker/fly.toml "${{ steps.fly-config.outputs.app_name }}" --strategy rolling --ha=false

  gate:
    name: Check Cloudflare deploy credentials
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing-secrets" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if node scripts/deploy/verify-cloudflare-deploy-credentials.mjs; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "reason=ready" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=invalid-credentials" >> "$GITHUB_OUTPUT"
          fi

  deploy-app:
    name: Deploy app (Cloudflare)
    needs: [changes, gate]
    if: needs.gate.outputs.enabled == 'true' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          package-manager-cache: false
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Clear wrangler deploy cache
        run: rm -rf node_modules/.cache/wrangler apps/app/.wrangler
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @docita/app run deploy:cloudflare:production

  deploy-internal:
    name: Deploy internal (Cloudflare)
    needs: [changes, gate]
    if: needs.gate.outputs.enabled == 'true' && needs.changes.outputs.internal == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          package-manager-cache: false
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Clear wrangler deploy cache
        run: rm -rf node_modules/.cache/wrangler apps/internal/.wrangler
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @docita/internal run deploy:cloudflare:production

  deploy-landing:
    name: Deploy landing (Cloudflare)
    needs: [changes, gate]
    if: needs.gate.outputs.enabled == 'true' && needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          package-manager-cache: false
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Clear wrangler deploy cache
        run: rm -rf node_modules/.cache/wrangler apps/landing/.wrangler
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @docita/landing run deploy:cloudflare
