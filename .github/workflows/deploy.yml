name: Deploy Production API and Worker

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "packages/auth/**"
      - "packages/db/**"
      - "packages/types/**"
      - "packages/utils/**"
      - "scripts/workflow/detect-workflow-scope.mjs"
      - "scripts/deploy/test-api-startup.sh"
      - "scripts/deploy/verify-db-schema-sync.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "fly.toml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/**"

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect deploy targets
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detect.outputs.api }}
      worker: ${{ steps.detect.outputs.worker }}
      db: ${{ steps.detect.outputs.db }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Detect changed deploy targets
        id: detect
        run: node scripts/workflow/detect-workflow-scope.mjs deploy

  migrate-db:
    name: Apply Prisma Migrations
    needs: changes
    if: >
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v5

      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mask database URL in logs
        run: echo "::add-mask::${{ secrets.DATABASE_URL }}"

      - name: Pre-migration RDS snapshot
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          RDS_INSTANCE_ID: ${{ secrets.RDS_INSTANCE_ID }}
          SKIP_RDS_SNAPSHOT: ${{ vars.SKIP_RDS_SNAPSHOT }}
        run: |
          set -euo pipefail
          if [ "${SKIP_RDS_SNAPSHOT:-}" = "true" ]; then
            echo "::warning title=RDS snapshot skipped::SKIP_RDS_SNAPSHOT=true; proceeding without a labeled pre-deploy snapshot"
            exit 0
          fi
          if [ -z "${RDS_INSTANCE_ID:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "::warning title=RDS snapshot skipped::RDS_INSTANCE_ID or AWS credentials not configured; relying on automated RDS backups"
            exit 0
          fi
          SNAPSHOT_ID="pre-deploy-${GITHUB_SHA::8}-$(date +%s)"
          echo "Creating RDS snapshot $SNAPSHOT_ID for $RDS_INSTANCE_ID"
          aws rds create-db-snapshot \
            --db-instance-identifier "$RDS_INSTANCE_ID" \
            --db-snapshot-identifier "$SNAPSHOT_ID" >/dev/null
          aws rds wait db-snapshot-completed \
            --db-snapshot-identifier "$SNAPSHOT_ID"
          echo "SNAPSHOT_ID=$SNAPSHOT_ID" >> "$GITHUB_ENV"
          echo "::notice title=RDS snapshot::Created $SNAPSHOT_ID (use this as the restore target if rollback is needed)"

      - name: Generate Prisma client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is required."
            exit 1
          fi
          pnpm --filter @workspace/db run db:generate

      - name: Run Prisma Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is required."
            exit 1
          fi
          pnpm --filter @workspace/db run db:migrate:safe

      - name: Verify database schema is in sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/deploy/verify-db-schema-sync.sh

  api-startup-smoke:
    name: API startup smoke test
    needs: [changes, migrate-db]
    if: >
      always() &&
      needs.changes.outputs.api == 'true' &&
      needs.migrate-db.result == 'success'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      APP_URL: https://app.docita.work
      NEXT_PUBLIC_APP_URL: https://app.docita.work
      NEXT_PUBLIC_API_URL: https://api.docita.work/api/v1
      CORS_ORIGINS: https://app.docita.work,https://internal.docita.work
      STORAGE_PROVIDER: r2
      QUEUE_BACKEND: postgres
      ENABLE_SCHEDULERS: false
      NODE_ENV: production
      STARTUP_TIMEOUT_SECONDS: 120
    steps:
      - uses: actions/checkout@v5

      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API startup smoke test
        run: scripts/deploy/test-api-startup.sh

  deploy-api:
    name: Deploy API (Fly.io)
    needs: [changes, migrate-db, api-startup-smoke]
    if: >
      always() &&
      needs.changes.outputs.api == 'true' &&
      needs.migrate-db.result == 'success' &&
      needs.api-startup-smoke.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Read Fly app from fly.toml
        id: fly-config
        run: |
          app_name="$(ruby -e 'puts File.read("fly.toml")[/^\s*app\s*=\s*["'\'']([^"'\'']+)["'\'']\s*$/, 1]')"
          if [ -z "$app_name" ]; then
            echo "Unable to read Fly app name from fly.toml"
            exit 1
          fi
          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy API to Fly.io
        run: flyctl deploy --config fly.toml --app "${{ steps.fly-config.outputs.app_name }}" --remote-only

  deploy-worker:
    name: Deploy Worker (Fly.io)
    needs: [changes, migrate-db]
    if: >
      always() &&
      needs.changes.outputs.worker == 'true' &&
      needs.migrate-db.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WORKER }}
    steps:
      - uses: actions/checkout@v5
      - name: Read Fly app from apps/worker/fly.toml
        id: fly-config
        run: |
          app_name="$(ruby -e 'puts File.read("apps/worker/fly.toml")[/^\s*app\s*=\s*["'\'']([^"'\'']+)["'\'']\s*$/, 1]')"
          if [ -z "$app_name" ]; then
            echo "Unable to read Fly app name from apps/worker/fly.toml"
            exit 1
          fi
          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy Worker to Fly.io
        run: flyctl deploy --config apps/worker/fly.toml --app "${{ steps.fly-config.outputs.app_name }}" --remote-only --ha=false
