name: Daily Worker Queue Drain

on:
  schedule:
    # 7:00 AM IST = 1:30 AM UTC every day
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Duration in minutes to keep the worker running"
        required: true
        default: "5"
        type: choice
        options:
          - "2"
          - "5"
          - "10"
          - "15"

concurrency:
  group: daily-worker-drain
  cancel-in-progress: false

jobs:
  drain-queue:
    name: Run Worker and Drain Queue
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run worker to drain pending queues
        run: |
          DURATION="${{ inputs.duration_minutes || '5' }}"
          chmod +x scripts/deploy/run-daily-worker.sh
          ./scripts/deploy/run-daily-worker.sh "$DURATION"
