name: Daily Worker Queue Drain

on:
  schedule:
    # 7:00 AM IST = 1:30 AM UTC every day
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Duration in minutes to keep the worker running"
        required: true
        default: "5"
        type: choice
        options:
          - "2"
          - "5"
          - "10"
          - "15"

concurrency:
  group: daily-worker-drain
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain-queue:
    name: Run Worker and Drain Queue
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WORKER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0

      - name: Verify worker lifecycle handling
        run: |
          bash -n scripts/deploy/run-daily-worker.sh
          node --test scripts/deploy/run-daily-worker.test.mjs

      - name: Verify Fly credential is configured
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN_WORKER is required for the worker drain."
            exit 1
          fi

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run worker to drain pending queues
        env:
          DURATION_MINUTES: ${{ inputs.duration_minutes || '5' }}
        run: bash scripts/deploy/run-daily-worker.sh "$DURATION_MINUTES"
