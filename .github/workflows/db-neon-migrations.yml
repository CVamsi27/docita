name: Neon DB Migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/db/prisma/migrations/**"
      - "packages/db/prisma/schema.prisma"
      - ".github/workflows/db-neon-migrations.yml"

jobs:
  migrate-neon:
    name: Apply Prisma Migrations to Neon
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            pnpm --filter @workspace/db run db:generate
          fi

      - name: Run Safe Prisma Migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            pnpm --filter @workspace/db run db:migrate:safe
          fi
