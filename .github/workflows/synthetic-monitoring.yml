name: Synthetic uptime monitoring

# Enabled after the 13 October TLS recovery. API idle shutdown remains enabled;
# run-probes.mjs owns bounded cold-start retries. This workflow samples three
# times daily and does not establish minute-level uptime or alert-delivery proof.
# Recovery and verification evidence: docs/operations/STABILITY_RUNBOOK.md.

on:
  schedule:
    # Samples at 8:45 AM, 2:30 PM and 7:30 PM IST. The API may be suspended
    # between requests; this schedule does not control its operating hours.
    - cron: "15 3 * * *"
    - cron: "0 9,14 * * *"
  workflow_dispatch:

concurrency:
  group: synthetic-monitoring
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  probes:
    name: Run production synthetic probes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run synthetic probes
        env:
          SYNTHETIC_API_ORIGIN: https://api.docita.work/api
          SYNTHETIC_API_BASE_URL: https://api.docita.work/api/v1
          SYNTHETIC_APP_BASE_URL: https://app.docita.work
          SYNTHETIC_MONITOR_EMAIL: ${{ secrets.SYNTHETIC_MONITOR_EMAIL }}
          SYNTHETIC_MONITOR_PASSWORD: ${{ secrets.SYNTHETIC_MONITOR_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          # Enables one-shot Fly machine restart when the API looks frozen on
          # resume (see fly-recovery.mjs). Reuses the existing api deploy token.
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: node scripts/monitoring/synthetic/run-probes.mjs
