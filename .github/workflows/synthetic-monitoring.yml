name: Synthetic uptime monitoring

on:
  schedule:
    # IST business hours only (8:30 AM – 8:30 PM IST = 03:00–15:00 UTC), the
    # window scale-api-hours.yml keeps the API machine running. Outside it the
    # API is intentionally scaled to 0, so probing it would just page on
    # expected "downtime".
    #
    # The 8:30 AM run is offset by 15 minutes (3:15 AM UTC) to avoid racing
    # with scale-api-hours.yml which fires at 3:00 AM UTC and destroys+creates
    # the API machine. Without the offset the probe often runs before the new
    # machine is healthy, causing "no machines in process group" in recovery.
    # Runs land at 8:45 AM, 2:30 PM, and 7:30 PM IST.
    - cron: "15 3 * * *"
    - cron: "0 9,14 * * *"
  workflow_dispatch:

concurrency:
  group: synthetic-monitoring
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  probes:
    name: Run production synthetic probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run synthetic probes
        env:
          SYNTHETIC_API_ORIGIN: https://api.docita.work/api
          SYNTHETIC_API_BASE_URL: https://api.docita.work/api/v1
          SYNTHETIC_APP_BASE_URL: https://app.docita.work
          SYNTHETIC_MONITOR_EMAIL: ${{ secrets.SYNTHETIC_MONITOR_EMAIL }}
          SYNTHETIC_MONITOR_PASSWORD: ${{ secrets.SYNTHETIC_MONITOR_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          # Enables one-shot Fly machine restart when the API looks frozen on
          # resume (see fly-recovery.mjs). Reuses the existing api deploy token.
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: node scripts/monitoring/synthetic/run-probes.mjs
