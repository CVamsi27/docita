name: Sync staging with main

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  open-sync-pr:
    name: Open main → staging sync PR
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref != 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Create sync PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_PR_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const title = 'sync: align staging with main';
            const body = [
              '## Summary',
              'Sync `staging` to mirror `main` after merges to `main` so the staging environment always matches production code.',
              '',
              '## Merge method',
              'Merge with **Rebase and merge** or **Squash and merge** (avoid merge commits if `staging` disallows them).',
            ].join('\n');

            // If a sync PR is already open, do nothing.
            const { data: openPrs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'staging',
              head: `${owner}:main`,
              per_page: 100,
            });

            if (openPrs.length > 0) {
              core.info(`Sync PR already exists: ${openPrs[0].html_url}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head: 'main',
              base: 'staging',
              body,
              maintainer_can_modify: true,
            });

            core.info(`Created sync PR: ${pr.html_url}`);

            // Enable auto-merge so the PR merges once required checks pass.
            // This requires:
            // - Repository setting: "Allow auto-merge" enabled
            // - Token permissions to merge into `staging`
            try {
              const mutation = `
                mutation EnableAutoMerge($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) {
                    pullRequest {
                      number
                      autoMergeRequest {
                        enabledAt
                        mergeMethod
                      }
                    }
                  }
                }
              `;

              // `node_id` is a GraphQL Node ID for the PR.
              await github.graphql(mutation, { pullRequestId: pr.node_id });
              core.info(`Enabled auto-merge for PR #${pr.number}`);
            } catch (error) {
              core.warning(
                `Could not enable auto-merge for PR #${pr.number}. ` +
                  `This can happen if auto-merge is disabled, branch protection blocks it, ` +
                  `or the token lacks permissions. Error: ${error?.message ?? String(error)}`,
              );
            }
