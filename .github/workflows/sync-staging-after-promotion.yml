name: Mirror staging to main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mirror-staging:
    name: Fast-forward `staging` to `main`
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fast-forward staging to main
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_PR_TOKEN || github.token }}
        run: |
          set -euo pipefail

          git fetch origin main staging

          # Update the `staging` ref to point at the exact `main` SHA.
          # This avoids creating new commits on `staging` and keeps ahead/behind at 0.
          git remote set-url origin "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "origin/main:refs/heads/staging" --force-with-lease
