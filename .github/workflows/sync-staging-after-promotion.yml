name: Sync staging after promotion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mirror-staging:
    name: Mirror `staging` ref to `main`
    runs-on: ubuntu-latest
    steps:
      - name: Update staging ref
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_PR_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: main } = await github.rest.git.getRef({
              owner,
              repo,
              ref: 'heads/main',
            });
            const { data: staging } = await github.rest.git.getRef({
              owner,
              repo,
              ref: 'heads/staging',
            });
            if (main.object.sha === staging.object.sha) {
              core.info('staging already mirrors main');
              return;
            }
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: 'heads/staging',
              sha: main.object.sha,
              force: true,
            });
            core.info(`Moved staging to ${main.object.sha}`);
