name: E2E Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: docita
          POSTGRES_PASSWORD: password
          POSTGRES_DB: docita
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.4.1

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter @docita/app exec playwright install --with-deps

      - name: Setup Database
        env:
          DATABASE_URL: postgresql://docita:password@localhost:5432/docita
        run: |
          pnpm db:generate
          pnpm db:push

      - name: Run E2E Tests
        env:
          DATABASE_URL: postgresql://docita:password@localhost:5432/docita
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: super-secret-jwt-key-minimum-32-characters-long
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          API_URL: http://localhost:3001/api/v1
          NODE_ENV: test
          # Mock explicit keys to prevent startup failure
          OPENAI_API_KEY: sk-mock-key
          META_PHONE_NUMBER_ID: 123456789
          META_ACCESS_TOKEN: mock-token
          META_APP_SECRET: mock-secret
          META_VERIFY_TOKEN: mock-token
        run: pnpm test:e2e
