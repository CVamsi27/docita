name: API E2E Tests

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  api-e2e-tests:
    name: API E2E Tests (${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            total: 4
          - shard: 2
            total: 4
          - shard: 3
            total: 4
          - shard: 4
            total: 4
    env:
      PGHOST: localhost
      PGPORT: "5434"
      PGUSER: docita
      PGPASSWORD: password
      # The suite runs single-process (jest --runInBand) and OOM'd at the
      # default 2GB Node heap (`FATAL ERROR: Ineffective mark-compacts near
      # heap limit`, exit 134). Give each shard a 4GB heap.
      # Four shards, not two: one process carrying ~29 heavy suites against a
      # single database intermittently broke unrelated suites (a transport
      # `socket hang up`, and timing-sensitive assertions), so the shard count
      # is a capacity control, not just a memory workaround.
      NODE_OPTIONS: --max-old-space-size=4096
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docita
          POSTGRES_PASSWORD: password
          POSTGRES_DB: docita_test
          POSTGRES_INITDB_ARGS: >-
            --set=shared_preload_libraries=pg_stat_statements
            --set=pg_stat_statements.track=all
            --set=pg_stat_statements.max=10000
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U docita -d docita_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
      - name: Use Node.js 22.22.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: "pnpm"
      - name: Install dependencies
        # Root postinstall already runs `pnpm db:generate`.
        run: pnpm install --frozen-lockfile
      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://docita:password@localhost:5434/docita_test
        run: pnpm db:deploy
      - name: Run API E2E Tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        env:
          DATABASE_URL: postgresql://docita:password@localhost:5434/docita_test
          JWT_SECRET: super-secret-jwt-key-for-testing-purposes-only
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          NODE_ENV: test
          APP_URL: http://localhost:3001
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
          CORS_ORIGINS: http://localhost:3000
          WHATSAPP_PRODUCTION_MODE: "false"
        run: pnpm --filter @docita/api run test:e2e:shard ${{ matrix.shard }}/${{ matrix.total }}
