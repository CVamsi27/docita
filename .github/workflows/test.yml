name: End-to-End Tests

on:
  push:
    branches: [main]
    paths:
      - 'apps/app/**'
      - 'packages/auth/**'
      - 'packages/data-access/**'
      - 'packages/hooks/**'
      - 'packages/types/**'
      - 'packages/ui/**'
      - 'packages/utils/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  pull_request:
    paths:
      - 'apps/app/**'
      - 'packages/auth/**'
      - 'packages/data-access/**'
      - 'packages/hooks/**'
      - 'packages/types/**'
      - 'packages/ui/**'
      - 'packages/utils/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-smoke:
    name: Frontend Playwright Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check repository hygiene
        run: pnpm check:hygiene

      - name: Install Playwright browsers
        run: pnpm --filter @docita/app exec playwright install --with-deps

      - name: Run frontend E2E smoke test
        env:
          API_URL: http://127.0.0.1:3001/api/v1
          APP_URL: http://127.0.0.1:3000
          NODE_ENV: test
        run: |
          unset NO_COLOR
          pnpm --filter @docita/app exec playwright test e2e/health.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: apps/app/playwright-report/
          if-no-files-found: ignore
          retention-days: 30
