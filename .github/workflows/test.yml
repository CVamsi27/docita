name: End-to-End Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    name: Frontend Playwright Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check repository hygiene
        run: pnpm check:hygiene

      - name: Install Playwright browsers
        run: pnpm --filter @docita/app exec playwright install --with-deps

      - name: Run frontend E2E smoke test
        env:
          API_URL: http://localhost:3001/api
          APP_URL: http://localhost:3000
          NODE_ENV: test
        run: pnpm --filter @docita/app exec playwright test e2e/health.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/app/playwright-report/
          retention-days: 30
