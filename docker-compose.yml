version: "3.8"

# NOTE: This docker-compose.yml is for LOCAL DEVELOPMENT ONLY
# For production deployment, see docs/DEPLOYMENT_GUIDE.md
# Production uses: Neon DB + AWS EC2 + Vercel

services:
  web:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    develop:
      watch:
        - action: sync
          path: ./apps/app
          target: /app/apps/app
          ignore:
            - node_modules/

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://docita:docita@db:5432/docita?schema=public&sslmode=disable
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      - db
      - redis
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /app/apps/api
          ignore:
            - node_modules/
        - action: rebuild
          path: ./packages/types/src
          target: /app/packages/types/src

  # Local PostgreSQL for development
  # Production uses Neon Serverless PostgreSQL
  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=docita
      - POSTGRES_PASSWORD=docita
      - POSTGRES_DB=docita
    volumes:
      - db_data:/var/lib/postgresql/data

  # Test PostgreSQL
  db_test:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=docita
      - POSTGRES_PASSWORD=docita
      - POSTGRES_DB=docita_test
    volumes:
      - db_test_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"

volumes:
  db_data:
  db_test_data:

networks:
  default:
    name: docita-network
