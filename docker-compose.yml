version: "3.8"

# NOTE: This docker-compose.yml is for LOCAL DEVELOPMENT ONLY.
# For production deployment, see docs/operations/DEPLOYMENT.md.
# Production stack: apps/api on Fly.io (Mumbai), apps/{app,internal,landing}
# on Cloudflare Workers, AWS RDS Postgres (Mumbai) for the DB, Cloudflare R2
# for object storage. Sibling docker-compose services (db, redis) stand up the
# local dev equivalents.

services:
  web:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    develop:
      watch:
        - action: sync
          path: ./apps/app
          target: /app/apps/app
          ignore:
            - node_modules/

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://docita:docita@db:5432/docita?schema=public&sslmode=disable
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      - db
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /app/apps/api
          ignore:
            - node_modules/
        - action: rebuild
          path: ./packages/types/src
          target: /app/packages/types/src

  # Local PostgreSQL for development
  # Production uses Neon Serverless PostgreSQL
  db:
    image: postgres:15-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=docita
      - POSTGRES_PASSWORD=docita
      - POSTGRES_DB=docita
    volumes:
      - db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docita"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Test PostgreSQL
  db_test:
    profiles: ["test"]
    image: postgres:15-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=docita
      - POSTGRES_PASSWORD=docita
      - POSTGRES_DB=docita_test
    volumes:
      - db_test_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
volumes:
  db_data:
  db_test_data:

networks:
  default:
    name: docita-network
