services:
  - type: web
    name: docita-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: apps/api
    buildCommand: >-
      cd ../.. && corepack enable && pnpm install --frozen-lockfile &&
      pnpm --filter @workspace/db run build &&
      pnpm --filter @workspace/types run build &&
      pnpm --filter @workspace/utils run build &&
      pnpm --filter @docita/api run build
    startCommand: node dist/main
    healthCheckPath: /api/health/live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: docita-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: docita-db
    plan: basic-1gb
    region: singapore
