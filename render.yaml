services:
  - type: web
    name: docita-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: docita-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: docita-db
    plan: basic-1gb
    region: singapore
