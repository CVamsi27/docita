name = "docita-app"
compatibility_date = "2026-03-09"
main = ".open-next/worker.js"
compatibility_flags = ["nodejs_compat"]

# OpenNext Cloudflare output is generated by:
# pnpm --filter @docita/app run build:cloudflare
#
# Update this file with your Cloudflare account/project specific settings
# if your deployment process requires additional bindings.

[[routes]]
pattern = "app.docita.work"
custom_domain = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "docita-cache"

[vars]
NODE_ENV = "production"
DOCITA_CLOUDFLARE = "1"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
