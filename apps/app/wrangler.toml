name = "docita-app"
compatibility_date = "2026-03-09"
main = ".open-next/worker.js"
compatibility_flags = ["nodejs_compat"]

# OpenNext Cloudflare output is generated by:
# pnpm --filter @docita/app run build:cloudflare
#
# Update this file with your Cloudflare account/project specific settings
# if your deployment process requires additional bindings.

[[routes]]
pattern = "app.docita.work"
custom_domain = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "docita-cache"

[vars]
NODE_ENV = "production"
DOCITA_CLOUDFLARE = "1"
APP_URL = "https://app.docita.work"
API_URL = "https://api.docita.work/api/v1"
NEXT_PUBLIC_API_URL = "https://api.docita.work/api/v1"
NEXT_PUBLIC_APP_URL = "https://app.docita.work"
NEXT_PUBLIC_SOCKET_URL = "https://api.docita.work"
NEXT_PUBLIC_SENTRY_DSN = "https://f22671b3cd9222c1c1f8d7ad3b508ea9@o4511121149198336.ingest.de.sentry.io/4511121158242384"
NEXT_PUBLIC_SENTRY_PROJECT = "javascript-nextjs"
SENTRY_ORG = "docita"
NEXT_PUBLIC_ANALYTICS_URL = ""
NEXT_PUBLIC_ENABLE_CONSOLE_TOASTS = "false"
NEXT_PUBLIC_CAPTURE_CONSOLE_INFO = "false"
NEXT_PUBLIC_CAPTURE_CONSOLE_WARNINGS = "false"
NEXT_PUBLIC_RAZORPAY_KEY_ID = "rzp_live_SPNm7w8Ig24OSX"
NEXT_PUBLIC_WHATSAPP_SUPPORT_NUMBER = "918790311010"
NEXT_PUBLIC_CLINIC_NAME = "Docita"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
