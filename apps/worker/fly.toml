app = 'docita-worker'
# Production worker primary region. Was 'bom' (Mumbai) until 2026-07-29 when
# Fly shelved bom capacity; shifted to 'sin' (Singapore) in lockstep with the
# API. Keep this in sync with /fly.toml.
primary_region = 'sin'
swap_size_mb = 512

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  NODE_MAX_OLD_SPACE_SIZE_MB = '192'
  WORKER_ENTRYPOINT = 'worker'
  APP_URL = 'https://app.docita.work'
  NEXT_PUBLIC_APP_URL = 'https://app.docita.work'
  NEXT_PUBLIC_API_URL = 'https://api.docita.work/api/v1'
  CORS_ORIGINS = 'https://app.docita.work,https://internal.docita.work'
  RLS_ENABLED = 'true'
  QUEUE_BACKEND = 'postgres'
  STORAGE_PROVIDER = 'r2'
  ENABLE_SCHEDULERS = 'true'
  TURNSTILE_OPTIONAL = 'true'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
