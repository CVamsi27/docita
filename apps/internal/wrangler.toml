name = "docita-internal"
compatibility_date = "2026-03-31"
main = ".open-next/worker.js"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[env.production]
name = "docita-internal"

[[env.production.routes]]
pattern = "internal.docita.work"
custom_domain = true

[[env.production.r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "docita-cache"

[env.production.vars]
NODE_ENV = "production"
DOCITA_CLOUDFLARE = "1"
APP_URL = "https://internal.docita.work"
API_URL = "https://api.docita.work/api/v1"
API_PROXY_TARGET = "https://api.docita.work"
NEXT_PUBLIC_API_URL = "/api/v1"
NEXT_PUBLIC_SENTRY_DSN = "https://f22671b3cd9222c1c1f8d7ad3b508ea9@o4511121149198336.ingest.de.sentry.io/4511121158242384"
SENTRY_ORG = "docita"
SENTRY_PROJECT = "internal"

[env.staging]
name = "docita-internal-staging"

[[env.staging.routes]]
pattern = "staging-internal.docita.work"
custom_domain = true

[env.staging.vars]
NODE_ENV = "production"
DOCITA_CLOUDFLARE = "1"
APP_URL = "https://staging-internal.docita.work"
API_URL = "https://staging-api.docita.work/api/v1"
API_PROXY_TARGET = "https://staging-api.docita.work"
NEXT_PUBLIC_API_URL = "/api/v1"
NEXT_PUBLIC_SENTRY_DSN = "https://f22671b3cd9222c1c1f8d7ad3b508ea9@o4511121149198336.ingest.de.sentry.io/4511121158242384"
SENTRY_ORG = "docita"
SENTRY_PROJECT = "internal-staging"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
