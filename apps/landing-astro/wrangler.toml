name = "docita-landing-astro"
compatibility_date = "2026-04-05"
main = "dist/_worker.js"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "astro-landing.docita.work"
custom_domain = true

[assets]
directory = "dist"
binding = "ASSETS"

[vars]
NODE_ENV = "production"
DOCITA_CLOUDFLARE = "1"
PUBLIC_APP_URL = "https://app.docita.work"
PUBLIC_API_URL = "/api/v1"
API_PROXY_TARGET = "https://api.docita.work"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
