name = "docita-landing"
compatibility_date = "2026-03-31"
main = ".open-next/worker.js"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "landing.docita.work"
custom_domain = true

[[routes]]
pattern = "docita.work"
custom_domain = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NODE_ENV = "production"
DOCITA_CLOUDFLARE = "1"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
