app = 'docita-worker'
primary_region = 'bom'

[build]
  dockerfile = 'apps/api/Dockerfile'

[env]
  NODE_ENV = 'production'
  NODE_MAX_OLD_SPACE_SIZE_MB = '400'
  WORKER_ENTRYPOINT = 'worker'
  QUEUE_BACKEND = 'postgres'
  STORAGE_PROVIDER = 'r2'

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
