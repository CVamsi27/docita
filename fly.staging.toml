# fly.toml app configuration file for the staging environment
#
# This mirrors the production API image but keeps the runtime pointed at
# staging-specific URLs and non-production storage.

app = 'docita-api-staging'
primary_region = 'bom'

[build]
  dockerfile = 'apps/api/Dockerfile'

[env]
  NODE_ENV = 'staging'
  PORT = '3001'
  STORAGE_PROVIDER = 'local'
  APP_URL = 'https://staging-app.docita.work'
  NEXT_PUBLIC_APP_URL = 'https://staging-app.docita.work'
  NEXT_PUBLIC_API_URL = 'https://staging-api.docita.work/api/v1'
  CORS_ORIGINS = 'https://staging-app.docita.work,https://staging-internal.docita.work'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 150

[checks]
  [checks.health]
    port = 3001
    type = 'http'
    interval = '15s'
    timeout = '5s'
    grace_period = '60s'
    method = 'GET'
    path = '/api/health/live'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
