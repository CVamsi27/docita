app = 'docita-api'
primary_region = 'bom'

[build]
  dockerfile = 'apps/api/Dockerfile'

[env]
  NODE_ENV = 'production'
  NODE_MAX_OLD_SPACE_SIZE_MB = '1536'
  PORT = '3001'
  APP_URL = 'https://app.docita.work'
  NEXT_PUBLIC_APP_URL = 'https://app.docita.work'
  NEXT_PUBLIC_API_URL = 'https://api.docita.work/api/v1'
  CORS_ORIGINS = 'https://app.docita.work,https://internal.docita.work'
  STORAGE_PROVIDER = 'r2'
  QUEUE_BACKEND = 'postgres'
  ENABLE_SCHEDULERS = 'false'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 60

[checks]
  [checks.health]
    port = 3001
    type = 'http'
    interval = '15s'
    timeout = '5s'
    grace_period = '60s'
    method = 'GET'
    path = '/api/health/live'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
