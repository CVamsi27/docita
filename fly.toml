app = 'docita-api'
# Production API machines stay in Mumbai. CI reads this value and does not
# fall back to another region when Mumbai placement is temporarily unavailable.
primary_region = 'bom'

[build]
  dockerfile = 'apps/api/Dockerfile'

[env]
  NODE_ENV = 'production'
  NODE_MAX_OLD_SPACE_SIZE_MB = '1536'
  PORT = '3001'
  APP_URL = 'https://app.docita.work'
  NEXT_PUBLIC_APP_URL = 'https://app.docita.work'
  NEXT_PUBLIC_API_URL = 'https://api.docita.work/api/v1'
  CORS_ORIGINS = 'https://app.docita.work,https://internal.docita.work'
  RLS_ENABLED = 'true'
  STORAGE_PROVIDER = 'r2'
  QUEUE_BACKEND = 'postgres'
  CACHE_BACKEND = 'memory'
  ENABLE_SCHEDULERS = 'false'

[http_service]
  internal_port = 3001
  force_https = true
  # Keep one machine running during IST business hours (8:30 AM–8:30 PM) and
  # zero during off-hours. The scale-api-hours.yml workflow adjusts the count
  # on a schedule; this floor allows the off-hours zero-machine state.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 60

[checks]
  [checks.health]
    port = 3001
    type = 'http'
    interval = '15s'
    timeout = '5s'
    # grace_period is the safety net for deploys, host migration, and OOM
    # recovery. The steady-state clinician path stays on the running floor.
    grace_period = '240s'
    method = 'GET'
    path = '/api/health/live'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
