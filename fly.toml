# fly.toml app configuration file generated for docita-api on 2026-04-08T12:28:30+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'docita-api'
primary_region = 'bom'

[build]
  dockerfile = 'apps/api/Dockerfile'

[env]
  NODE_ENV = 'production'
  NODE_MAX_OLD_SPACE_SIZE_MB = '1536'
  PORT = '3001'
  STORAGE_PROVIDER = 'r2'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 80

[checks]
  [checks.health]
    port = 3001
    type = 'http'
    interval = '15s'
    timeout = '5s'
    grace_period = '60s'
    method = 'GET'
    path = '/api/health/live'

[[vm]]
  memory = '2gb'
  cpus = 1
  memory_mb = 2048
