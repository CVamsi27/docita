app = 'docita-api'
primary_region = 'bom'

[build]
  dockerfile = 'apps/api/Dockerfile'

[env]
  NODE_ENV = 'production'
  NODE_MAX_OLD_SPACE_SIZE_MB = '1536'
  PORT = '3001'
  APP_URL = 'https://app.docita.work'
  NEXT_PUBLIC_APP_URL = 'https://app.docita.work'
  NEXT_PUBLIC_API_URL = 'https://api.docita.work/api/v1'
  CORS_ORIGINS = 'https://app.docita.work,https://internal.docita.work'
  RLS_ENABLED = 'true'
  STORAGE_PROVIDER = 'r2'
  QUEUE_BACKEND = 'postgres'
  CACHE_BACKEND = 'memory'
  ENABLE_SCHEDULERS = 'false'

[http_service]
  internal_port = 3001
  force_https = true
  # 'suspend' (vs 'stop') snapshots RAM and wakes in ~1s on traffic.
  # Matches the "auto-off when idle, fast wake on traffic" intent without
  # paying for an always-on instance. See SYSTEM_DESIGN_AND_PATTERNS.md
  # §28.5 and ADR 0011 (apps/api Fly cold-start policy).
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 60

[checks]
  [checks.health]
    port = 3001
    type = 'http'
    interval = '15s'
    timeout = '5s'
    # grace_period is the safety net for the rare full cold start (deploy,
    # host migration, OOM). Steady-state wakes are ~1s thanks to 'suspend'.
    grace_period = '240s'
    method = 'GET'
    path = '/api/health/live'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
