app = 'docita-api'
# Production API primary region. Was 'bom' (Mumbai) until 2026-07-29 when Fly
# shelved bom capacity; shifted to 'sin' (Singapore) as the closest gateway
# region. CI deploys use this value via fly-deploy-in-primary-region.sh.
primary_region = 'sin'
swap_size_mb = 512

[build]
  dockerfile = 'apps/api/Dockerfile'

[env]
  NODE_ENV = 'production'
  NODE_MAX_OLD_SPACE_SIZE_MB = '384'
  PORT = '3001'
  APP_URL = 'https://app.docita.work'
  NEXT_PUBLIC_APP_URL = 'https://app.docita.work'
  NEXT_PUBLIC_API_URL = 'https://api.docita.work/api/v1'
  CORS_ORIGINS = 'https://app.docita.work,https://internal.docita.work'
  RLS_ENABLED = 'true'
  STORAGE_PROVIDER = 'r2'
  QUEUE_BACKEND = 'postgres'
  CACHE_BACKEND = 'memory'
  ENABLE_SCHEDULERS = 'false'
  TURNSTILE_OPTIONAL = 'true'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 60

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/health/live'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
